<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Corregedoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background: radial-gradient(circle at top, #121826 0%, #07090e 70%); 
            color: #e0e0e0; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh;
        }
        .navbar-pf { 
            background: rgba(17, 24, 39, 0.95); 
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #b58d3d; 
            padding: 15px 30px; 
        }
        .navbar-pf img { height: 55px; object-fit: contain; }
        .navbar-pf .brand-title { 
            color: #ffffff; 
            font-family: 'Playfair Display', serif;
            font-weight: 700; 
            font-size: 1.25em; 
            letter-spacing: 1.5px; 
            margin-left: 20px; 
        }
        .container-main { padding: 40px 20px; max-width: 1300px; margin: 0 auto; }
        .stats-card { 
            background: linear-gradient(135deg, #121826 0%, #0d1117 100%); 
            border: 1px solid #1f2937; 
            border-radius: 10px; 
            padding: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .stats-card h3 { font-size: 2em; margin: 0; color: #ffffff; font-weight: 700; font-family: 'Playfair Display', serif; }
        .stats-card p { margin: 0; color: #8b95a5; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .stats-icon { font-size: 2.2em; color: #b58d3d; opacity: 0.9; }
        .section-box { 
            background: linear-gradient(135deg, #121826 0%, #0d1117 100%); 
            border: 1px solid #1f2937; 
            border-radius: 10px; 
            padding: 30px; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .section-title { 
            color: #b58d3d; 
            border-bottom: 1px solid #1f2937; 
            padding-bottom: 12px; 
            margin-bottom: 24px; 
            font-size: 1em; 
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .table-pf { color: #e0e0e0; background-color: #0d1117; font-size: 0.9em; border-radius: 6px; overflow: hidden; margin-bottom: 0; }
        .table-pf th { background-color: #161b22; color: #b58d3d; border-color: #1f2937; padding: 14px; font-weight: 600; }
        .table-pf td { background-color: #0d1117; color: #e0e0e0; border-color: #1f2937; padding: 14px; }
        .badge-andamento { background-color: #b45309; color: #fff; padding: 6px 12px; font-weight: 500; border-radius: 4px; }
        .badge-finalizado { background-color: #047857; color: #fff; padding: 6px 12px; font-weight: 500; border-radius: 4px; }
        .btn-gold { background-color: #b58d3d; color: #ffffff; font-weight: 600; border: none; padding: 8px 18px; border-radius: 6px; transition: all 0.3s; }
        .btn-gold:hover { background-color: #c49a3c; color: #ffffff; }
        .forca-title { color: #e0e0e0; font-size: 1.1em; margin-top: 30px; margin-bottom: 15px; font-weight: 600; font-family: 'Playfair Display', serif; border-left: 4px solid #b58d3d; padding-left: 10px; }
        .timer-text { font-family: monospace; font-size: 1.1em; color: #eab308; }
    </style>
</head>
<body>

    <nav class="navbar navbar-pf d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <img id="imgBrasao" src="https://cdn.discordapp.com/attachments/1506412452643082390/1536434427230552084/Policia_Federal.svg.webp" alt="Brasão">
            <span class="brand-title" id="tituloInstituicao">PAINEL ADMINISTRATIVO - CORREGEDORIA</span>
        </div>
        <div>
            <a href="admin.html" class="btn btn-outline-warning btn-sm me-2" id="btnAdmin" style="display: none;"><i class="fas fa-users-cog"></i> Gerenciar Usuários</a>
            <button onclick="fazerLogout()" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>
    </nav>

    <div class="container-main">
        <div class="row">
            <div class="col-md-4">
                <div class="stats-card">
                    <div><p>Inquéritos em Andamento</p><h3 id="countAndamento">00</h3></div>
                    <i class="fas fa-spinner stats-icon"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <div><p>Inquéritos Finalizados</p><h3 id="countFinalizados">00</h3></div>
                    <i class="fas fa-check-circle stats-icon"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <div><p>Inquéritos Arquivados</p><h3 id="countArquivados">00</h3></div>
                    <i class="fas fa-archive stats-icon"></i>
                </div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">
                <span><i class="fas fa-clock"></i> Inquéritos em Andamento</span>
                <a href="gerador.html" class="btn btn-gold btn-sm"><i class="fas fa-plus"></i> Novo Inquérito</a>
            </div>
            <div id="containerAndamento">
                <!-- Tabelas agrupadas por polícia serão renderizadas aqui -->
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">
                <span><i class="fas fa-check-double"></i> Inquéritos Finalizados</span>
            </div>
            <div id="containerFinalizados">
                <!-- Tabelas agrupadas por polícia serão renderizadas aqui -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://qnfckdzotzenaqaswqjb.supabase.co'; 
        const supabaseKey = 'sb_publishable_353TT6z3RbRHvIpbQiaK1g_dWt1qAyU';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let emailUsuarioLogado = '';
        let instituicaoUsuarioLogado = '';

        const brasoesInstituicoes = {
            'POLÍCIA FEDERAL': 'https://cdn.discordapp.com/attachments/1506412452643082390/1536434427230552084/Policia_Federal.svg.webp',
            'POLÍCIA CIVIL': 'https://cdn.discordapp.com/attachments/1506412452643082390/1536778551871672370/Brasao_da_Policia_Civil_do_Estado_do_Rio_de_Janeiro.png',
            'POLÍCIA MILITAR': 'https://cdn.discordapp.com/attachments/1506412452643082390/1536779260776419348/Brasao_da_Policia_Militar_do_Estado_do_Rio_de_Janeiro_-_PMERJ.png',
            'POLÍCIA RODOVIÁRIA FEDERAL (PRF)': 'https://cdn.discordapp.com/attachments/1506412452643082390/1536779271903907880/PRF_new.png',
            'ROTA': 'https://cdn.discordapp.com/attachments/1506412452643082390/1536779285082407083/Brasao_da_Policia_Civil_do_Estado_do_Rio_de_Janeiro.png',
            'BOPE': 'https://cdn.discordapp.com/attachments/1506412452643082390/1536779234461360159/Brasao_do_Batalhao_de_Operacoes_Policias_Especiais_-_BOPE_-_PMERJ.png',
            'EXÉRCITO BRASILEIRO': 'https://cdn.discordapp.com/attachments/1380287643614449747/1536779418020872192/f3065a6434fa46195e6a7e64f18b0dd7.png'
        };

        async function verificarAcesso() {
            emailUsuarioLogado = localStorage.getItem('usuario_logado_email');
            
            if (!emailUsuarioLogado) {
                window.location.href = 'index.html';
                return;
            }

            if (emailUsuarioLogado === "kira@yagami.gov") {
                instituicaoUsuarioLogado = 'POLÍCIA FEDERAL';
                document.getElementById('btnAdmin').style.display = 'inline-block';
                document.getElementById('tituloInstituicao').innerText = "PAINEL ADMINISTRATIVO - POLÍCIA FEDERAL";
                document.getElementById('imgBrasao').src = brasoesInstituicoes['POLÍCIA FEDERAL'];
                return;
            }

            const { data, error } = await supabaseClient
                .from('perfis_usuarios') 
                .select('*')
                .eq('email', emailUsuarioLogado)
                .single();

            if (error || !data || data.status === 'Bloqueado') {
                alert("Sessão expirada ou acesso revogado.");
                localStorage.removeItem('usuario_logado_email');
                window.location.href = 'index.html';
                return;
            }

            instituicaoUsuarioLogado = data.instituicao || localStorage.getItem(`inst_${emailUsuarioLogado}`) || 'POLÍCIA FEDERAL';
            const instNormalizada = instituicaoUsuarioLogado.trim().toUpperCase();
            document.getElementById('tituloInstituicao').innerText = `PAINEL ADMINISTRATIVO - ${instNormalizada}`;
            
            if (brasoesInstituicoes[instNormalizada]) {
                document.getElementById('imgBrasao').src = brasoesInstituicoes[instNormalizada];
            }
        }

        async function fazerLogout() {
            localStorage.removeItem('usuario_logado_email');
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        function visualizarInquerito(id) {
            window.location.href = `gerador.html?id=${id}`;
        }

        async function finalizarInquerito(id, numero) {
            const meuEmailAdmin = "kira@yagami.gov"; 
            if (emailUsuarioLogado !== meuEmailAdmin && !instituicaoUsuarioLogado.includes('FEDERAL')) {
                alert("Apenas administradores podem finalizar inquéritos.");
                return;
            }

            if (!confirm(`Deseja realmente finalizar o inquérito nº ${numero}? O cronômetro será parado.`)) return;

            // Salva a data atual exata para travar o relógio
            const dataFinalizacao = new Date().toISOString(); 

            const { error } = await supabaseClient
                .from('inqueritos')
                .update({ status: 'Finalizado', data_fim: dataFinalizacao })
                .eq('id', id);

            if (error) {
                alert("Erro ao finalizar: " + error.message);
            } else {
                alert("Inquérito finalizado com sucesso!");
                carregarDashboard();
            }
        }

        async function apagarInquerito(id, numero) {
            const meuEmailAdmin = "kira@yagami.gov"; 
            if (emailUsuarioLogado !== meuEmailAdmin) {
                alert("Acesso negado. Apenas a administradora principal pode apagar documentos.");
                return;
            }

            if (!confirm(`ATENÇÃO: Deseja realmente APAGAR permanentemente o inquérito nº ${numero}?`)) return;

            const { error } = await supabaseClient
                .from('inqueritos')
                .delete()
                .eq('id', id);

            if (error) {
                alert("Erro ao apagar inquérito: " + error.message);
            } else {
                alert("Inquérito apagado com sucesso!");
                carregarDashboard();
            }
        }

        // --- LÓGICA DO CRONÔMETRO ---
        function formatarTempoDecorrido(ms) {
            if (ms < 0) ms = 0;
            const dias = Math.floor(ms / (1000 * 60 * 60 * 24));
            const horas = Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((ms % (1000 * 60)) / 1000);

            let tempoString = "";
            if (dias > 0) tempoString += `${dias}d `;
            tempoString += `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;
            return tempoString;
        }

        // Atualiza os relógios a cada 1 segundo
        setInterval(() => {
            const agora = new Date().getTime();
            document.querySelectorAll('.cronometro-ativo').forEach(el => {
                const dataInicio = el.getAttribute('data-inicio');
                if (dataInicio && dataInicio !== 'null') {
                    const inicioMs = new Date(dataInicio).getTime();
                    el.innerText = formatarTempoDecorrido(agora - inicioMs);
                } else {
                    el.innerText = "--:--:--";
                }
            });
        }, 1000);
        // ----------------------------

        function renderizarTabelasAgrupadas(agrupados, containerId, isFinalizado, souAdmin) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (Object.keys(agrupados).length === 0) {
                container.innerHTML = `<div class="text-center text-muted p-3">Nenhum inquérito registrado nesta categoria.</div>`;
                return;
            }

            for (const [forcaPolicial, inqueritos] of Object.entries(agrupados)) {
                // Criação da tabela para cada polícia
                let tabelaHTML = `
                    <div class="forca-title"><i class="fas fa-building"></i> ${forcaPolicial}</div>
                    <div class="table-responsive">
                        <table class="table table-pf table-hover align-middle mb-4">
                            <thead>
                                <tr>
                                    <th>Nº Inquérito</th>
                                    <th>Encarregado(a)</th>
                                    <th>Data Início</th>
                                    <th>${isFinalizado ? 'Tempo Total (Parado)' : 'Tempo Aberto (Cronômetro)'}</th>
                                    <th>Natureza</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                inqueritos.forEach(item => {
                    const botaoApagarHTML = souAdmin ? `<button class="btn btn-sm btn-outline-danger ms-1" title="Apagar Inquérito" onclick="apagarInquerito(${item.id}, '${item.numero}')"><i class="fas fa-trash"></i></button>` : '';
                    
                    let tempoHTML = "";
                    let dataInicioFormatada = item.data_inicio ? new Date(item.data_inicio).toLocaleString('pt-BR') : 'Não informada';

                    if (isFinalizado) {
                        // Tempo Parado (Fim - Início)
                        if (item.data_inicio && item.data_fim) {
                            const diff = new Date(item.data_fim).getTime() - new Date(item.data_inicio).getTime();
                            tempoHTML = `<span class="timer-text" style="color: #047857;">${formatarTempoDecorrido(diff)}</span>`;
                        } else {
                            tempoHTML = `<span class="text-muted">Desconhecido</span>`;
                        }
                    } else {
                        // Tempo Rodando
                        tempoHTML = `<span class="timer-text cronometro-ativo" data-inicio="${item.data_inicio}">Calculando...</span>`;
                    }

                    tabelaHTML += `
                        <tr>
                            <td>${item.numero}</td>
                            <td>${item.encarregado}</td>
                            <td>${dataInicioFormatada}</td>
                            <td>${tempoHTML}</td>
                            <td>${item.natureza}</td>
                            <td><span class="badge ${isFinalizado ? 'badge-finalizado' : 'badge-andamento'}">${item.status}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-info" title="Visualizar" onclick="visualizarInquerito(${item.id})"><i class="fas fa-eye"></i></button>
                                ${(!isFinalizado && souAdmin) ? `<button class="btn btn-sm btn-outline-success" title="Finalizar Inquérito" onclick="finalizarInquerito(${item.id}, '${item.numero}')"><i class="fas fa-check"></i></button>` : ''}
                                ${botaoApagarHTML}
                            </td>
                        </tr>
                    `;
                });

                tabelaHTML += `</tbody></table></div>`;
                container.innerHTML += tabelaHTML;
            }
        }

        async function carregarDashboard() {
            await verificarAcesso();

            if (!emailUsuarioLogado) return;

            const { data, error } = await supabaseClient
                .from('inqueritos')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Erro ao carregar os dados:", error.message);
                return;
            }

            let qtdAndamento = 0;
            let qtdFinalizados = 0;
            let qtdArquivados = 0;

            const meuEmailAdmin = "kira@yagami.gov";
            const souAdmin = (emailUsuarioLogado === meuEmailAdmin);
            const userInstNormalized = (instituicaoUsuarioLogado || '').trim().toUpperCase();
            const isPoliciaFederal = souAdmin;

            // Objetos para separar os inquéritos pelas Forças Policiais
            const inqueritosEmAndamentoAgrupados = {};
            const inqueritosFinalizadosAgrupados = {};

            if (data && data.length > 0) {
                data.forEach(item => {
                    let forcaInq = 'POLÍCIA FEDERAL'; // Padrão
                    if (item.dados_extras) {
                        try {
                            const ext = JSON.parse(item.dados_extras);
                            if (ext.forcaPolicial) forcaInq = ext.forcaPolicial.trim().toUpperCase();
                        } catch(e){}
                    }

                    // Se não for admin, filtra para ver apenas a própria corporação
                    if (!isPoliciaFederal && forcaInq !== userInstNormalized) {
                        return; 
                    }

                    if (item.status === 'Finalizado') {
                        qtdFinalizados++;
                        if (!inqueritosFinalizadosAgrupados[forcaInq]) inqueritosFinalizadosAgrupados[forcaInq] = [];
                        inqueritosFinalizadosAgrupados[forcaInq].push(item);
                    } else if (item.status === 'Arquivado') {
                        qtdArquivados++;
                    } else {
                        qtdAndamento++;
                        if (!inqueritosEmAndamentoAgrupados[forcaInq]) inqueritosEmAndamentoAgrupados[forcaInq] = [];
                        inqueritosEmAndamentoAgrupados[forcaInq].push(item);
                    }
                });
            }

            // Renderizar na tela
            renderizarTabelasAgrupadas(inqueritosEmAndamentoAgrupados, 'containerAndamento', false, souAdmin);
            renderizarTabelasAgrupadas(inqueritosFinalizadosAgrupados, 'containerFinalizados', true, souAdmin);

            document.getElementById('countAndamento').innerText = String(qtdAndamento).padStart(2, '0');
            document.getElementById('countFinalizados').innerText = String(qtdFinalizados).padStart(2, '0');
            document.getElementById('countArquivados').innerText = String(qtdArquivados).padStart(2, '0');
        }

        carregarDashboard();
    </script>
</body>
</html>
