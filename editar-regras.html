<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Regras - Corregedoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { background: radial-gradient(circle at top, #121826 0%, #07090e 70%); color: #e0e0e0; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .navbar-pf { background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(10px); border-bottom: 2px solid #b58d3d; padding: 15px 30px; }
        .navbar-pf .brand-title { color: #ffffff; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.25em; letter-spacing: 1.5px; margin-left: 15px; }
        .container-main { padding: 30px; max-width: 1000px; margin: 0 auto; }
        .section-box { background: linear-gradient(135deg, #121826 0%, #0d1117 100%); border: 1px solid #1f2937; border-radius: 10px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .section-title { color: #b58d3d; border-bottom: 1px solid #1f2937; padding-bottom: 12px; margin-bottom: 24px; font-size: 1.1em; font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        .form-label { color: #9ca3af; font-size: 0.85em; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control, .form-select { background-color: #1f2937; border: 1px solid #374151; color: #ffffff; }
        .form-control:focus, .form-select:focus { background-color: #111827; color: #ffffff; border-color: #b58d3d; box-shadow: 0 0 0 0.25rem rgba(181, 141, 61, 0.25); }
        .btn-gold { background-color: #b58d3d; color: #ffffff; font-weight: 600; border: none; padding: 10px 20px; border-radius: 6px; transition: all 0.3s; }
        .btn-gold:hover { background-color: #c49a3c; color: #ffffff; }
        textarea { font-family: monospace; font-size: 0.9em; }
    </style>
</head>
<body>

    <nav class="navbar navbar-pf d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <span class="brand-title">EDITOR DE REGRAS - ADMINISTRAÇÃO</span>
        </div>
        <div>
            <a href="dashboard.html" class="btn btn-outline-info btn-sm"><i class="fas fa-arrow-left"></i> Voltar ao Painel</a>
        </div>
    </nav>

    <div class="container-main">
        <div class="section-box">
            <div class="section-title"><i class="fas fa-edit"></i> Editar Seção de Regras</div>
            
            <div class="row g-3">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Selecione a Regra para Editar</label>
                    <select id="selectRegra" class="form-select" onchange="carregarDadosRegra()">
                        <option value="">-- Escolha uma seção --</option>
                        <option value="introducao">Introdução</option>
                        <option value="cidade">Cidade / Polícia</option>
                        <option value="departamento">Regras de Departamento</option>
                        <option value="prisoes">Prisões</option>
                        <option value="proibicoes">Proibições</option>
                        <option value="tempo-advertencia">Tempo de Advertência</option>
                        <option value="farm-dominas">Farm / Dominas</option>
                        <option value="regras-gerais">Regras Gerais (Patrulha)</option>
                        <option value="abordagem-aerea">Abordagem Aérea</option>
                        <option value="blitz">Blitz</option>
                        <option value="investigacoes">Investigações</option>
                        <option value="ro">R.O.</option>
                        <option value="incursoes">Incursões</option>
                        <option value="pacificacoes">Pacificações</option>
                        <option value="acoes">Ações Policiais</option>
                        <option value="recrutamentos">Recrutamentos</option>
                        <option value="transferencia">Transferência</option>
                        <option value="troca-nome">Troca de Nome</option>
                        <option value="porte-arma">Porte de Arma</option>
                        <option value="limpeza-ficha">Limpeza de Ficha</option>
                        <option value="blacklist">Blacklist</option>
                        <option value="sets">Sets</option>
                        <option value="discord">Discord</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Capítulo</label>
                    <input type="text" id="regraCapitulo" class="form-control" placeholder="Ex: CAPÍTULO I">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Título</label>
                    <input type="text" id="regraTitulo" class="form-control" placeholder="Ex: Prisões">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Ícone (FontAwesome)</label>
                    <input type="text" id="regraIcone" class="form-control" placeholder="Ex: fa-handcuffs">
                </div>

                <div class="col-md-12 mt-3">
                    <label class="form-label">Conteúdo da Regra (HTML)</label>
                    <textarea id="regraTexto" class="form-control" rows="15" placeholder="Insira o código HTML da regra aqui..."></textarea>
                    <small class="text-muted">Atenção: O conteúdo deve estar formatado em HTML (utilize as classes de cards do padrão atual).</small>
                </div>

                <div class="col-md-12 text-end mt-4">
                    <button class="btn btn-gold" onclick="salvarRegra()"><i class="fas fa-save"></i> Salvar Alterações no Sistema</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://qnfckdzotzenaqaswqjb.supabase.co'; 
        const supabaseKey = 'sb_publishable_353TT6z3RbRHvIpbQiaK1g_dWt1qAyU';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const emailAdmin = "kira@yagami.gov";
        let emailUsuarioLogado = localStorage.getItem('usuario_logado_email') || '';

        // Bloqueio de Segurança
        if (emailUsuarioLogado !== emailAdmin) {
            alert("Acesso restrito. Apenas a administradora principal pode editar as regras.");
            window.location.href = 'dashboard.html';
        }

        async function carregarDadosRegra() {
            const chave = document.getElementById('selectRegra').value;
            if (!chave) {
                limparCampos();
                return;
            }

            const { data, error } = await supabaseClient
                .from('regras_policia')
                .select('*')
                .eq('chave', chave)
                .single();

            if (data) {
                document.getElementById('regraCapitulo').value = data.capitulo || '';
                document.getElementById('regraTitulo').value = data.titulo || '';
                document.getElementById('regraIcone').value = data.icone || '';
                document.getElementById('regraTexto').value = data.texto || '';
            } else {
                limparCampos();
                alert("Regra ainda não cadastrada no banco. Você pode criar agora preenchendo os campos e salvando.");
            }
        }

        async function salvarRegra() {
            const chave = document.getElementById('selectRegra').value;
            if (!chave) {
                alert("Selecione uma regra para salvar.");
                return;
            }

            const dados = {
                chave: chave,
                capitulo: document.getElementById('regraCapitulo').value,
                titulo: document.getElementById('regraTitulo').value,
                icone: document.getElementById('regraIcone').value,
                texto: document.getElementById('regraTexto').value
            };

            const { error } = await supabaseClient
                .from('regras_policia')
                .upsert([dados], { onConflict: 'chave' }); // O upsert cria se não existir, atualiza se existir

            if (error) {
                alert("Erro ao salvar a regra: " + error.message);
            } else {
                alert("Regra atualizada com sucesso no servidor!");
            }
        }

        function limparCampos() {
            document.getElementById('regraCapitulo').value = '';
            document.getElementById('regraTitulo').value = '';
            document.getElementById('regraIcone').value = '';
            document.getElementById('regraTexto').value = '';
        }
    </script>
</body>
</html>
