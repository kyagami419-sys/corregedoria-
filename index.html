<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Corregedoria Polícia Federal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #0b0f19; 
            color: #e0e0e0; 
            font-family: 'Arial', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background-color: #111827; 
            border: 1px solid #1f2937; 
            border-radius: 12px; 
            padding: 40px 30px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); 
        }
        .login-header { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .login-header img { 
            height: 75px; 
            margin-bottom: 15px; 
        }
        .login-header h4 { 
            color: #fff; 
            font-size: 1.25em; 
            font-weight: bold; 
            letter-spacing: 0.5px;
            margin: 0;
        }
        .form-label { 
            color: #9ca3af; 
            font-size: 0.85em; 
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-control { 
            background-color: #1f2937; 
            border: 1px solid #374151; 
            color: #fff; 
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95em;
        }
        .form-control:focus { 
            background-color: #1f2937; 
            color: #fff; 
            border-color: #d4af37; 
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); 
        }
        .btn-gold { 
            background-color: #d4af37; 
            color: #000; 
            font-weight: bold; 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 8px;
            font-size: 1em;
            transition: background-color 0.2s;
        }
        .btn-gold:hover { 
            background-color: #b5952f; 
            color: #000; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <img src="https://cdn.discordapp.com/attachments/1506412452643082390/1536434427230552084/Policia_Federal.svg.webp?ex=6a7b6391&is=6a7a1211&hm=e5c65d33e35b7a6c80747b36eaeb68321eead96e507c238b2585e77b73f665c4&" alt="PF">
            <h4>CORREGEDORIA GERAL</h4>
        </div>

        <form onsubmit="handleAuth(event)">
            <div class="mb-3">
                <label class="form-label">E-mail Institucional</label>
                <input type="email" id="emailInput" class="form-control" required placeholder="seu.email@pf.com">
            </div>
            <div class="mb-4">
                <label class="form-label">Senha de Acesso</label>
                <input type="password" id="passwordInput" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-gold" id="btnSubmitText">Autenticar</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.75em; color: #6b7280;">
            Site desenvolvido por valkyria - Apenas para fins de RP
        </div>
    </div>

    <!-- Importar o Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://qnfckdzotzenaqaswqjb.supabase.co'; 
        const supabaseKey = 'sb_publishable_353TT6z3RbRHvIpbQiaK1g_dWt1qAyU';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function handleAuth(event) {
            event.preventDefault();
            // Redireciona direto para o painel sem verificar senha
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
