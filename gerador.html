<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Inquérito - Corregedoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #0b0f19; color: #e0e0e0; font-family: 'Arial', sans-serif; }
        .navbar-pf { background-color: #111827; border-bottom: 2px solid #d4af37; padding: 15px 30px; }
        .container-main { padding: 30px; max-width: 1200px; margin: 0 auto; }
        .section-box { background-color: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 25px; margin-bottom: 25px; }
        .section-title { color: #d4af37; border-bottom: 1px solid #374151; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.1em; text-transform: uppercase; }
        .form-control, .form-select { background-color: #1f2937; border: 1px solid #374151; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #1f2937; color: #fff; border-color: #d4af37; box-shadow: none; }
        .btn-gold { background-color: #d4af37; color: #000; font-weight: bold; border: none; }
        .btn-gold:hover { background-color: #b5952f; color: #fff; }
        .btn-tab { background-color: #1f2937; color: #d4af37; border: 1px solid #d4af37; font-weight: bold; margin-right: 10px; }
        .btn-tab.active { background-color: #d4af37; color: #000; }
    </style>
</head>
<body>

    <nav class="navbar navbar-pf d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <span class="text-white fw-bold fs-5">SISTEMA INTEGRADO - CORREGEDORIA</span>
        </div>
        <div>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> Voltar ao Painel</a>
        </div>
    </nav>

    <div class="container-main">
        <div class="mb-4">
            <button class="btn btn-tab active" id="btnInqueritoPolicial"><i class="fas file-alt"></i> Inquérito Policial</button>
            <button class="btn btn-tab" onclick="window.location.href='portaria.html'"><i class="fas fa-file-contract"></i> Portaria</button>
            <button class="btn btn-tab" onclick="window.location.href='intimacao.html'"><i class="fas fa-envelope"></i> Intimação</button>
        </div>

        <div class="section-box">
            <div class="section-title"><i class="fas fa-shield-alt"></i> Instituição Responsável pelo Inquérito</div>
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label text-muted">Selecione a Força Policial</label>
                    <select id="forcaPolicial" class="form-select">
                        <option value="POLÍCIA FEDERAL">Polícia Federal</option>
                        <option value="POLÍCIA CIVIL">Polícia Civil</option>
                        <option value="POLÍCIA MILITAR">Polícia Militar</option>
                        <option value="PRF">PRF</option>
                        <option value="ROTA">ROTA</option>
                        <option value="BOPE">BOPE</option>
                        <option value="EXÉRCITO BRASILEIRO">Exército Brasileiro</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title"><i class="fas fa-info-circle"></i> Identificação do Inquérito</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label text-muted">Nº Inquérito</label>
                    <input type="text" id="numInquerito" class="form-control" placeholder="Ex: 001/2026">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted">Diretora Geral</label>
                    <input type="text" id="diretoraGeral" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted">Encarregado(a)</label>
                    <input type="text" id="encarregado" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted">Perito Criminal</label>
                    <input type="text" id="perito" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted">Escrivão</label>
                    <input type="text" id="escrivao" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted">Investigador</label>
                    <input type="text" id="investigador" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted">Setor</label>
                    <input type="text" id="setor" class="form-control" value="Corregedoria Geral">
                </div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title"><i class="fas fa-calendar-alt"></i> Dados do Registro</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label text-muted">Data/Hora Início</label>
                    <input type="datetime-local" id="dataIniciou" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted">Data/Hora Fim</label>
                    <input type="datetime-local" id="dataFim" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted">Município</label>
                    <input type="text" id="municipio" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted">Bairro</label>
                    <input type="text" id="bairro" class="form-control">
                </div>
                <div class="col-md-12">
                    <label class="form-label text-muted">Logradouro</label>
                    <input type="text" id="logradouro" class="form-control">
                </div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title"><i class="fas fa-pen-nib"></i> Natureza</div>
            <input type="text" id="natureza" class="form-control" placeholder="Ex: Prevaricação...">
        </div>

        <div class="text-end">
            <button class="btn btn-gold btn-lg px-5" onclick="salvarInquerito()"><i class="fas fa-save"></i> Salvar Inquérito</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://qnfckdzotzenaqaswqjb.supabase.co'; 
        const supabaseKey = 'sb_publishable_353TT6z3RbRHvIpbQiaK1g_dWt1qAyU';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const inqueritoId = urlParams.get('id');

        if (inqueritoId) {
            carregarDadosInquerito(inqueritoId);
        }

        async function salvarInquerito() {
            const numero = document.getElementById('numInquerito').value.trim();
            const encarregado = document.getElementById('encarregado').value.trim();
            const natureza = document.getElementById('natureza').value.trim();
            const forcaPolicial = document.getElementById('forcaPolicial').value;

            if (!numero) {
                alert("Preencha o número do inquérito.");
                return;
            }

            const dadosExtras = JSON.stringify({
                forcaPolicial: forcaPolicial,
                diretoraGeral: document.getElementById('diretoraGeral').value,
                perito: document.getElementById('perito').value,
                escrivao: document.getElementById('escrivao').value,
                investigador: document.getElementById('investigador').value,
                setor: document.getElementById('setor').value,
                municipio: document.getElementById('municipio').value,
                bairro: document.getElementById('bairro').value,
                logradouro: document.getElementById('logradouro').value,
                dataFim: document.getElementById('dataFim').value
            });

            const objetoSalvar = {
                numero: numero,
                encarregado: encarregado || 'Não informado',
                natureza: natureza || 'Não especificada',
                tipo: 'Inquérito Policial',
                status: 'Em Andamento',
                data_inicio: document.getElementById('dataIniciou').value || new Date().toISOString(),
                dados_extras: dadosExtras
            };

            let error;
            if (inqueritoId) {
                const res = await supabaseClient.from('inqueritos').update(objetoSalvar).eq('id', inqueritoId);
                error = res.error;
            } else {
                const res = await supabaseClient.from('inqueritos').insert([objetoSalvar]);
                error = res.error;
            }

            if (error) {
                alert("Erro ao salvar: " + error.message);
            } else {
                alert("Inquérito salvo com sucesso!");
                window.location.href = 'dashboard.html';
            }
        }

        async function carregarDadosInquerito(id) {
            const { data, error } = await supabaseClient.from('inqueritos').select('*').eq('id', id).single();
            if (error || !data) return;

            document.getElementById('numInquerito').value = data.numero || '';
            document.getElementById('encarregado').value = data.encarregado || '';
            document.getElementById('natureza').value = data.natureza || '';
            if (data.data_inicio) {
                document.getElementById('dataIniciou').value = data.data_inicio.substring(0, 16);
            }

            if (data.dados_extras) {
                try {
                    const ext = JSON.parse(data.dados_extras);
                    if (ext.forcaPolicial) document.getElementById('forcaPolicial').value = ext.forcaPolicial;
                    document.getElementById('diretoraGeral').value = ext.diretoraGeral || '';
                    document.getElementById('perito').value = ext.perito || '';
                    document.getElementById('escrivao').value = ext.escrivao || '';
                    document.getElementById('investigador').value = ext.investigador || '';
                    document.getElementById('setor').value = ext.setor || '';
                    document.getElementById('municipio').value = ext.municipio || '';
                    document.getElementById('bairro').value = ext.bairro || '';
                    document.getElementById('logradouro').value = ext.logradouro || '';
                    if (ext.dataFim) document.getElementById('dataFim').value = ext.dataFim;
                } catch(e){}
            }
        }
    </script>
</body>
</html>
