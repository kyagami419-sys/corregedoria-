<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedir Mandado - Tribunal de Justiça</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { background: radial-gradient(circle at top, #0f172a 0%, #020617 100%); color: #e2e8f0; font-family: 'Inter', sans-serif; min-height: 100vh; margin: 0; }
        .navbar-tj { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border-bottom: 2px solid #b58d3d; padding: 12px 30px; }
        .navbar-tj .brand-title { color: #ffffff; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.25em; letter-spacing: 1.5px; }
        .container-main { padding: 40px 20px; max-width: 900px; margin: 0 auto; }
        .section-box { background-color: #0f172a; border: 1px solid #7f1d1d; border-radius: 8px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .section-header { border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; font-size: 1.2rem; font-weight: 600; color: #ef4444; font-family: 'Playfair Display', serif; }
        .form-label { color: #94a3b8; font-size: 0.85em; font-weight: 500; text-transform: uppercase; }
        .form-control, .form-select { background-color: #1e293b; border: 1px solid #334155; color: #ffffff; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; color: #ffffff; border-color: #ef4444; box-shadow: 0 0 0 0.25rem rgba(239, 68, 68, 0.25); }
        .btn-danger-tj { background-color: #7f1d1d; color: #fff; border: 1px solid #991b1b; padding: 12px 25px; border-radius: 4px; font-weight: 600; transition: 0.2s; width: 100%; }
        .btn-danger-tj:hover { background-color: #991b1b; }
    </style>
</head>
<body>
    <nav class="navbar navbar-tj d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <i class="fas fa-file-signature fs-3 me-3" style="color: #ef4444;"></i>
            <span class="brand-title">EXPEDIR MANDADO</span>
        </div>
        <div><a href="tj-dashboard.html" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> Voltar ao Painel</a></div>
    </nav>

    <div class="container-main">
        <div class="section-box">
            <div class="section-header"><i class="fas fa-scroll"></i> Nova Ordem Judicial</div>
            <form id="formMandado">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Processo Vinculado</label>
                        <input type="text" class="form-control" placeholder="Ex: 5001472-60.2026">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tipo de Mandado</label>
                        <select class="form-select">
                            <option>Prisão Preventiva</option>
                            <option>Busca e Apreensão</option>
                            <option>Condução Coercitiva</option>
                            <option>Alvará de Soltura</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Validade</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Alvo / Destinatário (Pessoa ou Local)</label>
                        <input type="text" class="form-control" placeholder="Nome do indivíduo ou endereço do local">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Texto da Ordem Judicial</label>
                        <textarea class="form-control" rows="8" placeholder="Ex: Manda o Senhor Oficial de Justiça ou Autoridade Policial que, em cumprimento ao presente mandado..."></textarea>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="button" class="btn-danger-tj" onclick="alert('Mandado Expedido com Sucesso!')"><i class="fas fa-pen-nib"></i> Expedir e Assinar Eletronicamente</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
